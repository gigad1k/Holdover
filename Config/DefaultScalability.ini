; HOLDOVER scalability tiers (GI plan item: wide-audience system requirements).
;
; Policy: ray tracing is OFF by default at every tier (r.Lumen.HardwareRayTracing=0);
; it is an opt-in option for capable GPUs (see the "Ultra" opt-in block below).
; Baseline GI is Lumen software ray tracing at every tier — the night ramp's look
; depends on emissive lamp poles feeding GI, so GI is never disabled outright.
;
; NOTE: cvars marked VERIFY can only be confirmed with the editor open on a machine
; with UE 5.8 (Docs/TEST_CHECKLIST.md → Rendering). If a cvar name is rejected in
; 5.8, fix it here rather than removing the tier.

[GlobalIlluminationQuality@0]
; Low — widest audience. Cheapest Lumen, no volumetrics.
r.VolumetricFog=0
r.Lumen.HardwareRayTracing=0
; VERIFY: r.LumenScene.RadianceCache.NumProbesToTraceBudget=48

[GlobalIlluminationQuality@1]
; Medium (default) — full look, software Lumen.
r.VolumetricFog=1
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@2]
; High — best software Lumen + volumetrics.
r.VolumetricFog=1
r.Lumen.HardwareRayTracing=0
; VERIFY: r.LumenScene.RadianceCache.NumProbesToTraceBudget=256

[GlobalIlluminationQuality@3]
; Ultra — High PLUS hardware ray tracing. This tier is the opt-in for RTX-capable
; GPUs; the settings menu (Phase 10) exposes it as the "Ray Tracing" toggle.
r.VolumetricFog=1
r.Lumen.HardwareRayTracing=1

[ReflectionQuality@0]
r.Lumen.HardwareRayTracing=0
r.VolumetricFog=0

[ReflectionQuality@1]
r.Lumen.HardwareRayTracing=0

[ReflectionQuality@2]
r.Lumen.HardwareRayTracing=0

[ReflectionQuality@3]
r.Lumen.HardwareRayTracing=1

; ---------------------------------------------------------------------------
; Ray-tracing OPT-IN outside of scalability (launch flag / settings menu hook):
;   -RenderQuality=3        (Ultra tier above)
; or set the cvars directly:
;   r.Lumen.HardwareRayTracing=1
;   r.RayTracing=1
; Never enable these by default — default config must stay software-only so the
; game boots on non-RT hardware (build plan: lower system requirements).
; ---------------------------------------------------------------------------
